name: Pull Request Checks

on:
  pull_request:

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and Bun
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run check
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  textlint:
    name: textlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node and Bun
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Only articles touched by the PR: warnings are style hints, errors fail the job.
      - name: Lint changed articles
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE...HEAD" -- 'content/**/*.md' 'content/*.md')
          if [ -z "$files" ]; then
            echo "No articles changed."
          else
            echo "$files" | xargs bunx textlint
          fi
