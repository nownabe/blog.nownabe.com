baseURL = "https://blog.nownabe.com/"
title = "nownab.log"
locale = "ja-JP"
enableEmoji = true
enableGitInfo = true

[module.hugoVersion]
min = "0.146.0"

[pagination]
pagerSize = 10

[services.googleAnalytics]
id = "G-PWWXNZ0XM3"

[outputs]
home = ["HTML", "RSS"]

[outputFormats.RSS]
mediatype = "application/rss+xml"
baseName = "feed"

[params]
author = "nownabe"
description = "the nownabe's life log"

[frontmatter]
lastmod = [":git", "lastmod", "date"]

[related]
threshold = 80
includeNewer = true
toLower = true

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "date"
weight = 10

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
codeFences = true
noClasses = false
