[tools]
bun = "1.3.8"
"aqua:betterleaks/betterleaks" = "1.8.1"

[settings]
lockfile = true
locked = true
minimum_release_age = "3d"

[tasks.setup]
description = "Initialize the repository"
run = [
  "mise install",
  "mise generate git-pre-commit --task pre-commit --write",
  "bun install --frozen-lockfile",
]

[tasks.pre-commit]
description = "Scan staged changes for secrets with betterleaks"
run = "betterleaks git --staged --no-banner --redact"

[tasks.server]
description = "Run the dev server"
run = "bun run dev"

[tasks.build]
description = "Build the site into dist/"
run = "bun run build"

[tasks.check]
description = "Type-check templates and scripts"
run = "bun run check"

[tasks.lint]
description = "Lint articles with textlint"
run = "bun run lint"

[tasks.test]
description = "Run the Markdown plugin, social card and article convention checks"
run = "bun run test"

[tasks.new]
description = "Create content/<slug>.md and public/images/<slug>/"
usage = 'arg "<slug>"'
run = "bun run new {{arg(name='slug')}}"
