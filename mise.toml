[tools]
hugo-extended = "0.166.0"
node = "24.16.0"
"aqua:betterleaks/betterleaks" = "1.8.1"

[settings]
lockfile = true
locked = true
minimum_release_age = "3d"

[tasks.setup]
description = "Initialize the repository"
run = [
  "mise install",
  "mise generate git-pre-commit --task pre-commit --write",
  "npm ci",
]

[tasks.pre-commit]
description = "Scan staged changes for secrets with betterleaks"
run = "betterleaks git --staged --no-banner --redact"

[tasks.server]
description = "Run the dev server"
run = "hugo server"

[tasks.build]
description = "Build the site into public/"
run = "hugo --minify"

[tasks.lint]
description = "Lint articles with textlint"
run = "npm run lint"

[tasks.new]
description = "Create content/<slug>.md and static/images/<slug>/"
usage = 'arg "<slug>"'
run = [
  "hugo new {{arg(name='slug')}}.md",
  "mkdir -p static/images/{{arg(name='slug')}}",
]
